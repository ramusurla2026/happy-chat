<ion-header class="profile-header">
  <ion-toolbar>

    <button
      class="back-btn"
      (click)="goBack()"
      aria-label="Back">

      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none">

        <path
          d="M15 19L8 12L15 5"
          stroke="#6C3DFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

      </svg>

    </button>

    

  </ion-toolbar>
</ion-header>

<ion-content
  [fullscreen]="true"
  class="profile-content">

  <div class="bg bg1"></div>
  <div class="bg bg2"></div>

  <div class="profile-wrapper">

    <!-- Avatar -->

    <div class="avatar-section">

      <div
        class="avatar"
        (click)="triggerAvatarPicker()">

        <img
          *ngIf="avatarPreviewUrl"
          [src]="avatarPreviewUrl">

        <div
          class="avatar-placeholder"
          *ngIf="!avatarPreviewUrl">

          <svg
            width="60"
            height="60"
            viewBox="0 0 24 24">

            <path
              fill="#9D8CFF"
              d="M12 12c2.76 0 5-2.24 5-5S14.76 2 12 2 7 4.24 7 7s2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5z"/>

          </svg>

        </div>

      </div>

      <button
        class="camera-btn"
        (click)="triggerAvatarPicker()">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24">

          <path
            fill="#fff"
            d="M12 17a4 4 0 100-8 4 4 0 000 8zm8-12h-3.2L15 3H9L7.2 5H4a2 2 0 00-2 2v11a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2z"/>

        </svg>

      </button>

      <input
        hidden
        #avatarInput
        type="file"
        accept="image/*"
        (change)="onAvatarSelected($event)">

    </div>

    <!-- Heading -->

    <h1 class="title">

      Set up your profile

    </h1>

    <p class="subtitle">

      Tell everyone who you are and personalize your HappyChat profile.

    </p>

    <form
      [formGroup]="form"
      class="profile-form"
      (ngSubmit)="onContinue()">

      <!-- Full Name -->

      <div class="field">

        <label>

          Full Name

        </label>

        <ion-input
          class="input"
          placeholder="John David"
          formControlName="fullName"  readonly="true">

        </ion-input>

        <small
          class="error"
          *ngIf="form.get('fullName')?.touched &&
                 form.get('fullName')?.invalid">

          Full Name is required

        </small>

      </div>

      <!-- Username -->

      <div class="field">

        <label>

          Username

        </label>

        <div class="username-box">

          <span>@</span>

          <ion-input
            class="username-input"
            placeholder="john_david"
            formControlName="username"  readonly="true">

          </ion-input>

        </div>

        <small
          class="error"
          *ngIf="form.get('username')?.touched &&
                 form.get('username')?.invalid">

          Username is required

        </small>

      </div>

            <!-- Profession -->

      <div class="field">

        <label>

          Profession

        </label>

        <ion-input
          class="input"
          placeholder="Software Engineer"
          formControlName="profession">

        </ion-input>

        <small
          class="error"
          *ngIf="form.get('profession')?.touched &&
                 form.get('profession')?.invalid">

          Profession is required

        </small>

      </div>

      <!-- Bio -->

      <div class="field">

        <label>

          Bio

        </label>

        <ion-textarea
          class="field__textarea"
          rows="4"
          maxlength="120"
          placeholder="Tell everyone about yourself..."
          formControlName="bio">

        </ion-textarea>

        <div class="bio-counter">

          {{ bioLength }} / {{ bioMaxLength }}

        </div>

        <small
          class="error"
          *ngIf="form.get('bio')?.touched &&
                 form.get('bio')?.invalid">

          Bio is required

        </small>

      </div>

      <!-- Continue Button -->

      <ion-button
        expand="block"
        class="btn-primary"
        type="submit">

        Continue

        <svg
          class="btn-primary__icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M5 12H19M13 6L19 12L13 18"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </ion-button>

      <!-- Footer -->

      <p class="legal-copy">

        By continuing you agree to our

        <a (click)="onOpenTerms()">

          Terms of Service

        </a>

        &

        <a >

          Privacy Policy

        </a>

      </p>

    </form>

  </div>

</ion-content>
